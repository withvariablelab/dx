pre-commit:
  parallel: true
  jobs:
    - name: jsc
      run: pnpm rr jsc --fix-staged
      stage_fixed: true

    - name: tsc
      run: pnpm rr tsc
      glob:
        - "*.{ts,tsx,mts,cts}"
        - "*tsconfig*.json"

    # Naming gitleaks makes mise install only it when it's missing. A bare `mise exec --` first installs every missing
    # tool of the active toolset, those of the global config too, and one that fails to install fails every commit.
    - name: gitleaks
      run: mise exec gitleaks -- gitleaks git --pre-commit --staged --redact
