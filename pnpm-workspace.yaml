packages:
  - shared/*
  - run-run/*
  - vland/cli

catalog:
  "@types/node": 26.6.6
  "@types/semver": 7.8.0
  semver: 7.8.5
  tsdown: 0.23.4
  typescript: 7.0.2

allowBuilds:
  lefthook: true

sideEffectsCache: false

# Supply-chain cooldown: malicious releases are usually pulled within 24h.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@variablelab/*"
  - "@rrlab/*"
  - "@variableland/*"
