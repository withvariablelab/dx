name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main

# Each label run gets a group of its own, so labels added at once can't cancel the run GitHub reads Test from.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.action == 'labeled' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-node:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The `engines.node` floor, pinned (and locked) in mise.floor.toml.
          - node: floor
            mise_env: floor
          # The version mise.toml pins.
          - node: default
            mise_env: ""
    env:
      MISE_ENV: ${{ matrix.mise_env }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install: true
          cache: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 💅 Check
        run: pnpm rr check

      - name: 🧪 Test
        run: pnpm test

      - name: 🔨 Build
        run: pnpm build

  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install_args: gitleaks
          cache: true

      - name: 🔐 Scan the new commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: gitleaks git --redact --verbose --log-opts="$BASE_SHA..$HEAD_SHA"

  # The ruleset requires a check named "Test": this job reports the whole matrix and the secret scan under that name.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [test-node, secrets]
    if: ${{ always() }}
    permissions: {}
    steps:
      - name: ✅ Every Node version passed and no secret leaked
        env:
          TESTS: ${{ needs.test-node.result }}
          SECRETS: ${{ needs.secrets.result }}
        run: test "$TESTS" = "success" && test "$SECRETS" = "success"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      # vland-bot, not GITHUB_TOKEN, so CI runs on the version PR.
      - name: 🔑 Mint vland-bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.VLAND_BOT_CLIENT_ID }}
          private-key: ${{ secrets.VLAND_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install: true
          cache: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧑‍💻 Configure git user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      # No NPM_TOKEN: `changeset publish` runs `pnpm publish`, which does npm trusted publishing over OIDC itself.
      - name: 🚀 Release or version PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          publish-script: pnpm changeset publish
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          LEFTHOOK: 0

  # Runs PR code: never give this job the bot key.
  preview:
    name: Publish preview
    runs-on: ubuntu-latest
    needs: test
    # One publish per commit. A feat/fix branch publishes on opened, synchronize and reopened. Any other branch publishes
    # from the label run that adds `preview` (a PR opened with it too), then on synchronize and reopened while it has it.
    if: >-
      ${{ (github.event.action != 'labeled'
        && (startsWith(github.head_ref, 'feat') || startsWith(github.head_ref, 'fix')))
      || (github.event.action == 'labeled' && github.event.label.name == 'preview'
        && !startsWith(github.head_ref, 'feat') && !startsWith(github.head_ref, 'fix'))
      || ((github.event.action == 'synchronize' || github.event.action == 'reopened')
        && contains(github.event.pull_request.labels.*.name, 'preview')) }}
    # One publish to `pr-<number>` at a time: label runs don't share the workflow's group.
    concurrency:
      group: ${{ github.workflow }}-preview-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    outputs:
      packages: ${{ steps.preview.outputs.packages }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛠️ Setup mise
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install: true
          cache: true

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🚀 Publish preview
        id: preview
        uses: withvariablelab/gh-actions/actions/monorepo-preview-release@main
        with:
          mode: publish
          publish_mode: oidc-only
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # `packages` comes from PR code: pass it only through `with:`, never into `run:`.
  preview-comment:
    name: Comment preview
    needs: preview
    if: ${{ needs.preview.result == 'success' }}
    permissions: {}
    uses: withvariablelab/gh-actions/.github/workflows/preview-comment.yml@main
    with:
      action: monorepo-preview-release
      packages: ${{ needs.preview.outputs.packages }}
    secrets:
      VLAND_BOT_PRIVATE_KEY: ${{ secrets.VLAND_BOT_PRIVATE_KEY }}
